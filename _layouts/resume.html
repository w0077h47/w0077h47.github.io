<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-light: #dbeafe;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --bg-white: #ffffff;
      --bg-gray: #f9fafb;
      --border-color: #e5e7eb;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-gray);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .resume-container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header Card */
    .header-card {
      background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
      color: white;
      padding: 3rem 2.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .header-card h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .header-card .tagline {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }

    .header-card .contact-links a {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.2);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .header-card .contact-links a:hover {
      background: rgba(255,255,255,0.3);
    }

    /* Section Cards */
    .section-card {
      background: var(--bg-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .section-card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--primary-light);
    }

    /* Summary */
    .summary-text {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.8;
    }

    /* Competencies / Skills */
    .competency-group {
      margin-bottom: 1.25rem;
    }

    .competency-group:last-child {
      margin-bottom: 0;
    }

    .competency-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .skill-tag {
      background: var(--primary-light);
      color: var(--primary-color);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* Education */
    .education-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    .education-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .education-item:first-child {
      padding-top: 0;
    }

    .degree {
      font-weight: 600;
    }

    .school {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Experience */
    .experience-item {
      position: relative;
      padding-left: 1.5rem;
      padding-bottom: 2rem;
      border-left: 2px solid var(--primary-light);
    }

    .experience-item:last-child {
      padding-bottom: 0;
      border-left: 2px solid transparent;
    }

    .experience-item::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 0;
      width: 10px;
      height: 10px;
      background: var(--primary-color);
      border-radius: 50%;
    }

    .experience-header {
      margin-bottom: 0.75rem;
    }

    .company-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .job-title {
      color: var(--primary-color);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .job-dates {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .job-note {
      font-style: italic;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }

    .experience-item ul {
      list-style: none;
      padding: 0;
    }

    .experience-item li {
      position: relative;
      padding-left: 1.25rem;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .experience-item li::before {
      content: '>';
      position: absolute;
      left: 0;
      color: var(--primary-color);
      font-weight: 600;
    }

    /* Footer */
    .footer-links {
      text-align: center;
      padding: 1rem 0;
    }

    .footer-links a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .license {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin-top: 1rem;
    }

    .license a {
      color: var(--text-secondary);
    }

    /* Responsive */
    @media (max-width: 640px) {
      body {
        padding: 1rem 0.5rem;
      }

      .header-card {
        padding: 2rem 1.5rem;
      }

      .header-card h1 {
        font-size: 1.75rem;
      }

      .section-card {
        padding: 1.5rem;
      }

      .education-item {
        flex-direction: column;
        gap: 0.25rem;
      }
    }

    /* Print styles */
    @media print {
      body {
        background: white;
        padding: 0;
      }

      .header-card {
        background: var(--primary-color);
        box-shadow: none;
      }

      .section-card {
        box-shadow: none;
        border: 1px solid #ddd;
        break-inside: avoid;
      }

      .footer-links {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="resume-container">
    {{ content }}
  </div>
</body>
</html>
